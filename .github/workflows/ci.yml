name: CI

# CI is temporarily disabled (manual runs only): several physics-heavy tests
# flake on shared runners (aircraft/boat/cannon/fan/farming/juggling/water),
# so automatic runs were red noise. Re-enable by restoring the push +
# pull_request triggers:
#   push:
#     branches: ['**']
#   pull_request:
on:
  workflow_dispatch:

jobs:
  test:
    name: Harness tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP (dev server)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends php-cli

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run harness tests
        run: npm test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test/screenshots/
          if-no-files-found: ignore
